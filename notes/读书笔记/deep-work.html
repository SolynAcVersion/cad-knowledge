<h1>《深度工作》读书笔记</h1>
<div class="date">2026-09-18 · 读书笔记</div>

<h2>核心观点</h2>
<p>深度工作 = 在无干扰状态下专注进行的职业活动，能把认知能力推向极限。这种努力能创造新价值、提升技能，且难以复制。</p>
<h2>四种哲学</h2>
<ul>
<li><b>禁欲主义</b>：彻底切断浮浅事务</li>
<li><b>双峰哲学</b>：明确划分深度时段与开放时段</li>
<li><b>节奏哲学</b>：固定时间形成习惯</li>
<li><b>新闻记者哲学</b>：随时切入深度状态</li>
</ul>
<blockquote>「浮浅工作」的度量：对认知要求不高的事务性任务，往往在受干扰下开展。</blockquote>
