<h1>Git 常用命令速查</h1>
<div class="date">2026-09-20 · 技术笔记</div>

<h2>日常三件套</h2>
<pre>git add .
git commit -m "说明"
git push</pre>
<h2>分支操作</h2>
<pre>git checkout -b feature/xxx   # 新建并切换分支
git merge main                # 合并 main 到当前分支</pre>
<blockquote>提示：提交信息写清楚「做了什么」，半年后的你会感谢现在的你。</blockquote>
<h2>回退</h2>
<p>撤销工作区修改用 <code>git checkout -- 文件名</code>；回退提交用 <code>git reset --soft HEAD~1</code>。</p>
