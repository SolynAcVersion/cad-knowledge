max-width:760px;margin:0 auto;padding:56px 24px 96px;line-height:1.85;color:#1a1d24;background:#fff}
h1{font-size:32px;letter-spacing:-.02em;margin-bottom:8px}
.date{color:#6b7280;font-size:13.5px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid #e6e8ec}
h2{font-size:20px;margin:32px 0 12px}
code{background:#f2f4f8;padding:2px 7px;border-radius:5px;font-size:14px;color:#c0392b}
pre{background:#1a1d24;color:#e6e8ec;padding:18px;border-radius:12px;overflow-x:auto;font-size:13.5px;line-height:1.7}
blockquote{border-left:3px solid #2f6bff;background:#eaf0ff;padding:14px 20px;border-radius:0 10px 10px 0;margin:20px 0;color:#3a4256}

<body>
<h1>用 GitHub Pages 托管静态站点</h1>
<div class="date">2026-09-25 · 技术笔记</div>

<h2>三步上线</h2>
<pre>1. 新建仓库，命名为 用户名.github.io
2. 把 index.html 推到 main 分支
3. Settings → Pages → Source 选 main / root</pre>
<h2>访问地址</h2>
<p>几分钟后访问 <code>https://用户名.github.io</code> 即可。</p>
<blockquote>仓库名若不是 用户名.github.io，则网址为 https://用户名.github.io/仓库名/</blockquote>
